<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="ps.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1080" data-height="1920">
      <div class="ps">
        <div class="ps-glow" style="background: radial-gradient(52% 34% at 50% 30%, rgba(74,222,128,0.12), transparent 70%);"></div>
        <div class="shot">
          <div class="shot-head">
            <div class="shot-kicker" style="color: var(--success);">Session summary</div>
            <div class="shot-title">Know exactly<br /><span class="dim">where you stand.</span></div>
          </div>
          <div class="shot-phone-wrap">
            <div class="phone"><div class="notch"></div><div class="screen">
              <div class="screen-end">
                <div class="end-wrap">
                  <div class="end-tag">✓ SESSION SAVED</div>
                  <div class="end-net">+$1,240.00</div>
                  <div class="end-meta">19 hands · 2h 14m</div>
                </div>
              </div>
            </div></div>
          </div>
        </div>
      </div>
    </div>
    <script>window.__timelines['main'] = gsap.timeline({ paused: true });</script>
  </body>
</html>
